<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | My Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="media.html">Media</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <hr class="hr-header-divider">

  <main>
    <div class="card">
    <img src="MYSELF.jpg" alt="photo" style="max-width: 100px; border-radius: 50%; margin-bottom: 1.5rem;">
      <h1>Get In Touch</h1>
      <p>Have a project in mind? Fill out the form below and I'll respond as soon as possible.</p>

      <form action="https://example.com/submit-form" method="POST">
        <fieldset>
          <legend>Contact Information</legend>

          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" required>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" minlength="3" required>

          <label for="topic">Topic:</label>
          <select id="topic" name="topic" required>
            <option value="">-- Select a topic --</option>
            <option value="web-design">oil change</option>
            <option value="development">Overhaul</option>
            <option value="consultation">Tire change</option>
            <option value="other">Other</option>
          </select>

          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit">Send Message</button>
        </fieldset>
      </form>
    </div>
  </main>

  <hr class="hr-footer-divider">

</body>
